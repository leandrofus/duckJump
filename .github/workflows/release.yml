name: release

# Runs on a tag like v0.2.0: builds the rpm/deb packages (amd64, arm64), the static
# binaries for Linux (amd64/arm64), macOS (amd64/arm64), Windows (amd64), and the
# Windows MSI, and attaches them to the GitHub release, plus version-less "latest"
# copies of the packages for stable installation links.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to rebuild the site with the new release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # a manual run on a branch must not publish anything without a tag
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Version from tag or repository
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ -z "$ref" ] || [ "$ref" = "main" ]; then
            ref=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          fi
          echo "TAG=$ref" >> "$GITHUB_ENV"
          echo "VERSION=${ref#v}" >> "$GITHUB_ENV"

      - name: Web UI
        run: make web

      - name: Go tests
        run: make test-go

      # UI, static Go binaries, Rust built in a Debian 11 container (glibc 2.31),
      # then rpm + deb with nfpm. Binaries land in dist/pkg, packages in dist/packages.
      - name: Packages (rpm + deb)
        run: make packages VERSION="$VERSION"

      # Static binaries for all platforms (linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64)
      - name: Static multi-platform binaries
        run: make dist VERSION="$TAG"

      # Tarball from the portable binaries + version-less latest package aliases
      - name: Latest aliases & tarball
        run: |
          # Copy deb and rpm into dist/
          cp dist/packages/* dist/ 2>/dev/null || true

          # Create tarball from pkg binaries
          name="duckjump-$VERSION-linux-amd64"
          mkdir -p "dist/$name"
          cp -r dist/pkg/* README.md LICENSE ROADMAP.md "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

          # Version-less copies of the packages
          cd dist
          for f in duckjump-*.rpm; do
            [ -f "$f" ] || continue
            case "$f" in *-latest.*) continue ;; esac
            arch=${f%.rpm}; arch=${arch##*.}
            pkg_name=${f%%-*}
            cp "$f" "${pkg_name}-latest.$arch.rpm"
          done
          for f in duckjump_*.deb; do
            [ -f "$f" ] || continue
            case "$f" in *_latest_*) continue ;; esac
            arch=${f##*_}; arch=${arch%.deb}
            pkg_name=${f%%_*}
            cp "$f" "${pkg_name}_latest_$arch.deb"
          done
          ls -l *-latest.* *_latest_* || true

      - name: Checksums
        run: |
          cd dist && sha256sum duckjump* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: duckjump-${{ env.VERSION }}
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.tar.gz
            dist/duckjump-linux-*
            dist/duckjump-darwin-*
            dist/duckjump-windows-*
            dist/duckjump-agent-*
            dist/SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; case $VERSION in *-*) pre=--prerelease ;; esac
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "duckJump $VERSION" --generate-notes --verify-tag $pre
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "duckJump $VERSION" $pre || true
          fi
          cd dist
          files=$(ls -1 *.rpm *.deb *.tar.gz duckjump-* SHA256SUMS 2>/dev/null | sort -u)
          gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber

  msi:
    # Windows installer (service + Start menu shortcut) and duckjump-assist agent,
    # built with WiX and cargo on Windows and added to the release made above
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Web UI
        shell: pwsh
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
      - name: Build duckjump-assist CLI (Windows Rust)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo build --release --locked --manifest-path duckjumpd/Cargo.toml -p duckjump-assist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "duckjumpd/target/release/duckjump-assist.exe" "dist/duckjump-assist.exe"
          Copy-Item "duckjumpd/target/release/duckjump-assist.exe" "dist/duckjump-assist-windows-amd64.exe"
      - name: Build duckJump Assist Desktop App (Tauri NSIS & MSI)
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if (-not $v -or $v -eq "main") {
            $v = (git describe --tags --abbrev=0 2>$null).TrimStart('v')
            if (-not $v) { $v = "0.1.0" }
          }
          bun add -g @tauri-apps/cli
          cd duckjumpd/assist-app
          bunx @tauri-apps/cli build --bundles nsis,msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cd ../..
          $nsis = Get-ChildItem -Path "duckjumpd/assist-app/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "dist/duckjump-assist-app-setup.exe"
            Copy-Item $nsis.FullName "dist/duckjump-assist-app-$v-setup.exe"
          }
          $appMsi = Get-ChildItem -Path "duckjumpd/assist-app/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appMsi) {
            Copy-Item $appMsi.FullName "dist/duckjump-assist-app.msi"
            Copy-Item $appMsi.FullName "dist/duckjump-assist-app-$v-x64.msi"
          }
      - name: Gateway MSI
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if (-not $v -or $v -eq "main") {
            $v = (git describe --tags --abbrev=0 2>$null).TrimStart('v')
            if (-not $v) { $v = "0.1.0" }
          }
          cd gateway
          go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME" -o ../dist/duckjump.exe ./cmd/duckjump-gw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cd ..
          ./packaging/windows/build-msi.ps1 -Version $v -Exe dist/duckjump.exe -AssistExe dist/duckjump-assist.exe -Out "dist/duckjump-$v-x64.msi"
          Copy-Item "dist/duckjump-$v-x64.msi" dist/duckjump-latest-x64.msi
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or $tag -eq "main") {
            $tag = (git describe --tags --abbrev=0 2>$null)
            if (-not $tag) { $tag = "v0.1.0" }
          }
          $v = $tag.TrimStart('v')
          gh release download $tag -p SHA256SUMS -D sums --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = Get-Content sums/SHA256SUMS | Where-Object { $_ -notmatch '(\.msi|duckjump-assist.*)$' }
          $extraFiles = @(
            "duckjump-$v-x64.msi",
            "duckjump-latest-x64.msi",
            "duckjump-assist.exe",
            "duckjump-assist-windows-amd64.exe",
            "duckjump-assist-app-setup.exe",
            "duckjump-assist-app.msi"
          )
          $toUpload = @()
          foreach ($f in $extraFiles) {
            if (Test-Path "dist/$f") {
              $lines += "$((Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower())  $f"
              $toUpload += "dist/$f"
            }
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", ($lines -join "`n") + "`n")
          $toUpload += "dist/SHA256SUMS"
          gh release upload $tag $toUpload --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  site:
    needs: [release, msi]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # releases made with GITHUB_TOKEN do not trigger other workflows
        run: gh workflow run deploy-pages.yml --ref main
