# After ci passes on a version tag (v1.2.3, v1.2.3-rc1): build the rpm/deb
# packages and a tarball, and publish them as a GitHub release. The tests are
# not run again. workflow_run only fires for this file as it is on main.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    # For a tag push, head_branch is the tag name; ci runs on no branch but main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Version from the tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # UI, static Go binaries, Rust built in a Debian 11 container (glibc 2.31),
      # then rpm + deb with nfpm. Binaries land in dist/pkg, packages in dist/packages.
      - name: Packages
        run: make packages VERSION="$VERSION"

      # Tarball from the same portable binaries as the packages (not `make dist`,
      # which would link the Rust binaries against the runner's newer glibc).
      - name: Tarball and checksums
        run: |
          name=duckjump-$VERSION-linux-amd64
          mkdir -p "dist/$name"
          cp dist/pkg/* README.md LICENSE ROADMAP.md "dist/$name/"
          tar -C dist -czf "dist/packages/$name.tar.gz" "$name"
          cd dist/packages && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: duckjump-${{ env.VERSION }}
          path: dist/packages/*

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; case $VERSION in *-*) pre=--prerelease ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading packages..."
            gh release upload "$TAG" dist/packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "duckJump $VERSION" $pre || true
          else
            gh release create "$TAG" dist/packages/* --repo "$GITHUB_REPOSITORY" \
              --title "duckJump $VERSION" --generate-notes --verify-tag $pre
          fi
