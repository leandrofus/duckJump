[package]
name = "duckjumpd-rdp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "RDP worker for duckjumpd: one process per session, speaking DJTP on stdin/stdout"

# Own workspace (see the duckjumpd workspace's `exclude`).
[workspace]

[dependencies]
duckjump-proto = { path = "../crates/duckjump-proto" }
duckjump-gfx = { path = "../crates/duckjump-gfx" }
duckjump-net = { path = "../crates/duckjump-net" }
anyhow = "1"
bytes = "1"
futures = "0.3"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "pdu", "svc", "dvc", "cliprdr", "displaycontrol"] }
ironrdp-tokio = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls"] }
