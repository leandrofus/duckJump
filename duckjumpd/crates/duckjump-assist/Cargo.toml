[package]
name = "duckjump-assist"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "On-demand attended remote assistance agent for duckJump"

[dependencies]
duckjump-proto = { path = "../duckjump-proto" }
duckjump-gfx = { path = "../duckjump-gfx" }
duckjump-net = { path = "../duckjump-net" }
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hmac = "0.13"
sha1 = "0.11"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
png = "0.18"
enigo = "0.6.1"

[target.'cfg(unix)'.dependencies]
x11rb = "0.14.0"
ashpd = { version = "0.13.13", features = ["remote_desktop", "screencast"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]
