[package]
name = "duckjump-net"
description = "Reaching session targets (directly or through the edge relay) and the TLS pieces duckjumpd and its workers share"
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

# Not workspace-inherited: the RDP worker (its own workspace) uses it too.
[dependencies]
duckjump-proto = { path = "../duckjump-proto" }
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
