# nfpm config: built by packaging/build.sh (make packages)
name: duckjump
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: admin
priority: optional
maintainer: ${MAINTAINER}
description: |
  DuckJump access bastion: web access to SSH, RDP and VNC hosts with a
  credential vault, access grants, session recording and an audit trail.
  Includes the gateway (web UI and API) and the duckjumpd session daemon.
vendor: DuckJump
license: AGPL-3.0-or-later
homepage: https://github.com/leandrofus/duckJump

overrides:
  rpm:
    depends: [zlib, util-linux, shadow-utils]
  deb:
    depends: [zlib1g, util-linux, passwd]

contents:
  - src: ./dist/pkg/duckjump
    dst: /usr/bin/duckjump
    file_info: { mode: 0755 }
  - src: /usr/bin/duckjump
    dst: /usr/libexec/duckjump/duckjump-gw
    type: symlink
  - src: ./dist/pkg/duckjumpd
    dst: /usr/libexec/duckjump/duckjumpd
    file_info: { mode: 0755 }
  - src: ./dist/pkg/duckjumpd-rdp
    dst: /usr/libexec/duckjump/duckjumpd-rdp
    file_info: { mode: 0755 }
  # Served by the gateway (/support/…): it looks next to its executable.
  - src: ./dist/pkg/duckjump-assist
    dst: /usr/libexec/duckjump/duckjump-assist
    file_info: { mode: 0755 }
  - src: ./dist/pkg/duckjump-assist-app.AppImage
    dst: /usr/libexec/duckjump/duckjump-assist-app.AppImage
    file_info: { mode: 0644 }
  - src: ./dist/pkg/duckjump-assist-app.deb
    dst: /usr/libexec/duckjump/duckjump-assist-app.deb
    file_info: { mode: 0644 }
  - src: ./packaging/systemd/duckjump.service
    dst: /usr/lib/systemd/system/duckjump.service
  - src: ./packaging/systemd/duckjumpd.service
    dst: /usr/lib/systemd/system/duckjumpd.service
  - src: ./packaging/duckjump.env
    dst: /etc/duckjump/duckjump.env
    type: config|noreplace
    file_info: { mode: 0644 }

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
