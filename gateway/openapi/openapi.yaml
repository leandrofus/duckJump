          type: string
        name:
          maxLength: 128
          type: string
      type: object
    UpdateUserRequest:
      additionalProperties: false
      properties:
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          format: email
          type: string
        role:
          $ref: '#/components/schemas/Role'
      type: object
    User:
      properties:
        created_at:
          format: date-time
          type: string
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        last_login_at:
          format: date-time
          type:
            - string
            - "null"
        role:
          $ref: '#/components/schemas/Role'
        source:
          enum:
            - local
            - oidc
          type: string
        totp_enabled:
          type: boolean
        updated_at:
          format: date-time
          type: string
        username:
          type: string
      required:
        - id
        - username
        - display_name
        - email
        - source
        - role
        - disabled
        - totp_enabled
        - created_at
        - updated_at
        - last_login_at
      type: object
  securitySchemes:
    session:
      in: cookie
      name: duckjump_session
      type: apiKey
info:
  description: 'Administration and portal API of the DuckJump access bastion. Authenticate with POST /auth/login, which sets the duckjump_session cookie. Every request that changes state must also send the X-DuckJump-Request header (any value): together with the SameSite=Strict cookie it blocks cross-site requests.'
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: DuckJump API
  version: 0.1.0
openapi: 3.1.0
paths:
  /audit/events:
    get:
      description: |-
        Newest first. Page with before_id = the last id received.

        Roles: admin, auditor, superadmin.
      operationId: listAuditEvents
      parameters:
        - in: query
          name: before_id
          schema:
            type: integer
        - in: query
          name: actor_id
          schema:
            type: string
        - example: auth.login_failed
          in: query
          name: action
          schema:
            type: string
        - in: query
          name: object_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 100
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuditEvent'
                type: array
          description: Events
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Audit log
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
  /audit/files:
    get:
      description: |-
        Every file that went through the gateway, newest first.

        Roles: admin, auditor, superadmin.
      operationId: listFilesAudit
      parameters:
        - in: query
          name: owner_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 100
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TrayFile'
                type: array
          description: Files
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: File transfers
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
  /audit/files/{id}/content:
    get:
      description: |-
        For auditors, while its content is kept. Audited (file.view).

        Roles: admin, auditor, superadmin.
      operationId: downloadFileAudit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error 410
      summary: Download a transferred file (evidence)
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
  /audit/sessions:
    get:
      description: |-
        Newest first. Page with before = started_at of the last session received.

        Roles: admin, auditor, superadmin.
      operationId: listSessions
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: connection_id
          schema:
            type: string
        - description: Only sessions still open.
          in: query
          name: active
          schema:
            type: boolean
        - in: query
          name: before
          schema:
            format: date-time
            type: string
        - in: query
          name: limit
          schema:
            default: 100
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Session'
                type: array
          description: Sessions
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Session history
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
  /audit/sessions/{id}:
    get:
      description: 'Roles: admin, auditor, superadmin.'
      operationId: getSessionRecord
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: The session
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      summary: Get a session
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
  /audit/sessions/{id}/recording:
    get:
      description: |-
        asciicast v2 for terminal sessions (playable with asciinema); for VNC and RDP the DuckJump graphical format (DJGFX1, see duckjumpd recording.rs). Served gzip-compressed when the client accepts it. For a session still open it returns what has been recorded so far. 410 when the retention policy already deleted it. Allowed to auditors and admins, and to users holding view_recordings on the session's connection. Every download is audited.

        Roles: admin, auditor, superadmin, user.
      operationId: getRecording
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/x-asciicast:
              schema:
                type: string
          description: The recording
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error 410
      summary: Download a session recording
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
        - user
  /audit/sessions/{id}/terminate:
    post:
      description: |-
        Ends an open session now: the user's tunnel closes with the reason. The request is recorded (append-only) and audited; a gateway process holding the session picks it up within seconds even when it is not the one that received the request.

        Roles: admin, superadmin.
      operationId: terminateSession
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateSessionRequest'
        required: false
      responses:
        "202":
          description: Termination requested
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflicts with the current state
      summary: Terminate a live session
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - superadmin
  /audit/verify:
    get:
      description: |-
        Recomputes every event hash. ok=false points at the first event that was altered or removed.

        Roles: admin, auditor, superadmin.
      operationId: verifyAudit
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
          description: Verification result
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Verify the audit hash chain
      tags:
        - audit
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
  /auth/login:
    post:
      description: Sets the duckjump_session cookie. When the user has TOTP enabled the session is only half open (mfa_required) until POST /auth/totp. Five failures per username and address within 15 minutes lock that pair out for the rest of the window.
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Logged in, or waiting for the TOTP step
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many attempts
      security: []
      summary: Log in
      tags:
        - auth
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        "204":
          description: Session closed and cookie cleared
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Log out
      tags:
        - auth
      x-duckjump-mfa-pending-allowed: true
  /auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: The caller
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
      summary: Who am I
      tags:
        - auth
      x-duckjump-mfa-pending-allowed: true
  /auth/me/password:
    put:
      description: |-
        Ends my other sessions and re-issues this one's cookie.

        Roles: admin, auditor, superadmin, user.
      operationId: changePassword
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        "204":
          description: Password changed
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Change my password
      tags:
        - auth
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
        - user
  /auth/me/totp:
    delete:
      description: 'Roles: admin, auditor, superadmin, user.'
      operationId: totpDisable
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
      responses:
        "204":
          description: TOTP disabled
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Disable my TOTP
      tags:
        - auth
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
        - user
  /auth/me/totp/confirm:
    post:
      description: 'Roles: admin, auditor, superadmin, user.'
      operationId: totpConfirm
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        "204":
          description: TOTP enabled
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflicts with the current state
      summary: Confirm TOTP enrollment
      tags:
        - auth
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
        - user
  /auth/me/totp/enroll:
    post:
      description: |-
        Returns a new secret; it takes effect after POST /auth/me/totp/confirm.

        Roles: admin, auditor, superadmin, user.
      operationId: totpEnroll
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPEnrollment'
          description: Secret to load in an authenticator app
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflicts with the current state
      summary: Start TOTP enrollment
      tags:
        - auth
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
        - user
  /auth/oidc/callback:
    get:
      description: Where the identity provider returns the browser. Verifies the state, redeems the code, checks the ID token, provisions the user and opens a session; then redirects to the UI (with login_error on failure). Audited.
      operationId: oidcCallback
      responses:
        "303":
          description: To the UI
      security: []
      summary: Single sign-on callback
      tags:
        - auth
  /auth/oidc/login:
    get:
      description: Redirects the browser to the identity provider (authorization code flow with PKCE).
      operationId: oidcLogin
      responses:
        "302":
          description: To the identity provider
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      security: []
      summary: Start single sign-on
      tags:
        - auth
  /auth/providers:
    get:
      description: For the login page. No authentication needed.
      operationId: authProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
          description: Sign-in methods
      security: []
      summary: How users can sign in
      tags:
        - auth
  /auth/totp:
    post:
      operationId: loginTOTP
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Logged in
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many attempts
      summary: Second login step (TOTP)
      tags:
        - auth
      x-duckjump-mfa-pending-allowed: true
  /connections:
    get:
      description: 'Roles: admin, superadmin.'
      operationId: listConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Connection'
                type: array
          description: The whole catalog
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: List connections
      tags:
        - connections
      x-duckjump-roles:
        - admin
        - superadmin
    post:
      description: 'Roles: admin, superadmin.'
      operationId: createConnection
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflicts with the current state
      summary: Create a connection
      tags:
        - connections
      x-duckjump-roles:
        - admin
        - superadmin
  /connections/{id}:
    delete:
      description: |-
        Also deletes the policies on it. Session history is kept.

        Roles: admin, superadmin.
      operationId: deleteConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRF'
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      summary: Delete a connection
      tags:
        - connections
      x-duckjump-roles:
        - admin
        - superadmin
    get:
      description: 'Roles: admin, superadmin.'
      operationId: getConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: The connection
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      summary: Get a connection
      tags:
        - connections
      x-duckjump-roles:
        - admin
        - superadmin
    patch:
      description: 'Roles: admin, superadmin.'
      operationId: updateConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: Updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
