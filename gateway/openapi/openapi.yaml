  /connections/{id}/session:
    get:
      description: |-
        Upgrades to a WebSocket. Binary messages carry terminal bytes both ways; text messages carry JSON control: {"type":"resize","cols":N,"rows":N} from the client; ready, exit and error from the server. Requires a connect grant on the connection. The session is recorded per the connection's settings and audited.

        Roles: admin, auditor, superadmin, user.
      operationId: tunnel
      parameters:
        - in: query
          name: cols
          schema:
            default: 80
            type: integer
        - in: query
          name: rows
          schema:
            default: 24
            type: integer
        - description: 'RDP: desktop width in pixels.'
          in: query
          name: width
          schema:
            default: 1280
            type: integer
        - description: 'RDP: desktop height in pixels.'
          in: query
          name: height
          schema:
            default: 800
            type: integer
        - description: 'The client sends the credentials as its first text message: {"type":"credentials","username","password","domain"}. Only for connections without a vaulted credential; they are used once and never stored.'
          in: query
          name: credentials
          schema:
            enum:
              - 1
            type: integer
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching to the WebSocket protocol
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not implemented yet
      summary: Open a session (WebSocket)
      tags:
        - portal
      x-duckjump-roles:
        - admin
        - auditor
        - superadmin
        - user
