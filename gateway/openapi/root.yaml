# Static part of the spec. Paths and component schemas are generated by
# `make openapi` (cmd/openapi-gen) from `openapi:operation` and
# `openapi:schema` comments in internal/**. Do not edit openapi.yaml by hand.
openapi: 3.1.0
info:
  title: DuckJump API
  version: 0.1.0
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  description: >-
    Administration and portal API of the DuckJump access bastion. Authenticate
    with POST /auth/login, which sets the duckjump_session cookie. Every request
    that changes state must also send the X-DuckJump-Request header (any value):
    together with the SameSite=Strict cookie it blocks cross-site requests.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: auth, description: Login and the caller's own account. }
  - { name: portal, description: 'What the caller may open, and opening it.' }
  - { name: users, description: Local users. }
  - { name: groups, description: Groups and membership. }
  - { name: folders, description: Catalog tree. }
  - { name: sites, description: Where hosts live; agent sites are reached through edge agents. }
  - { name: secrets, description: Vaulted credentials (write-only values). }
  - { name: connections, description: The catalog of hosts. }
  - { name: policies, description: 'Grants of access to connections, folders or tags.' }
  - { name: audit, description: 'Audit log, session history and recordings.' }
  - { name: settings, description: Gateway-wide settings such as the recording retention. }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: duckjump_session
  parameters:
    CSRF:
      name: X-DuckJump-Request
      in: header
      required: true
      schema: { type: string }
      description: Any value. Required on every state-changing request.
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: 'Machine-readable code, e.g. not_found, conflict, csrf.' }
        message: { type: string }
